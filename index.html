<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hostel Food Saver</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family: Arial, sans-serif;
      background:#0f172a;
      color:white;
      min-height:100vh;
      padding:20px;
    }

    .container{
      max-width:800px;
      margin:auto;
    }

    .header{
      text-align:center;
      margin-bottom:30px;
    }

    .header h1{
      font-size:2.2rem;
      margin-bottom:10px;
    }

    .header p{
      color:#cbd5e1;
    }

    .card{
      background:#1e293b;
      border-radius:20px;
      padding:24px;
      margin-bottom:20px;
      box-shadow:0 8px 20px rgba(0,0,0,0.3);
    }

    label{
      display:block;
      margin-bottom:8px;
      font-weight:bold;
    }

    input,select{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      margin-bottom:18px;
      background:#334155;
      color:white;
    }

    button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:12px;
      background:#2563eb;
      color:white;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    button:hover{
      background:#1d4ed8;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
      gap:15px;
      margin-top:20px;
    }

    .stat{
      background:#334155;
      border-radius:15px;
      padding:20px;
      text-align:center;
    }

    .stat h2{
      font-size:2rem;
      margin-bottom:5px;
    }

    .coordinator{
      margin-top:20px;
      padding-top:15px;
      border-top:1px solid #475569;
      color:#cbd5e1;
    }

    @media(max-width:600px){
      .header h1{
        font-size:1.8rem;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🍽️ Hostel Food Saver</h1>
    <p>Reduce food waste by confirming your daily meal attendance</p>
  </div>

  <div class="card">

    <form id="foodForm">

      <label>Student Name</label>
      <input type="text" id="name" required>

      <label>Room Number</label>
      <input type="text" id="room" required>

      <label>Meal Time</label>
      <select id="meal" required>
        <option value="">Select Meal</option>
        <option>Breakfast</option>
        <option>Lunch</option>
        <option>Dinner</option>
      </select>

      <label>Will you eat today?</label>
      <select id="status" required>
        <option value="">Choose Option</option>
        <option value="yes">Yes, I will eat</option>
        <option value="no">No, I will not eat</option>
      </select>

      <button type="submit">Submit Response</button>

    </form>

    <div class="stats">

      <div class="stat">
        <h2 id="eatCount">0</h2>
        <p>Eating</p>
      </div>

      <div class="stat">
        <h2 id="skipCount">0</h2>
        <p>Skipping</p>
      </div>

      <div class="stat">
        <h2 id="wasteSaved">0 kg</h2>
        <p>Waste Saved</p>
      </div>

    </div>

    <div class="coordinator">
      <strong>Food Waste Coordinator:</strong><br>
      Hridanshu | Hostel Mess Committee
    </div>

  </div>

</div>

<script>

let eating = 0;
let skipping = 0;

document.getElementById("foodForm").addEventListener("submit", function(e){

  e.preventDefault();

  const status = document.getElementById("status").value;

  if(status === "yes"){
    eating++;
  } else if(status === "no"){
    skipping++;
  }

  document.getElementById("eatCount").innerText = eating;
  document.getElementById("skipCount").innerText = skipping;

  const saved = (skipping * 0.7).toFixed(1);
  document.getElementById("wasteSaved").innerText = saved + " kg";

  alert("Response submitted successfully!");

  document.getElementById("foodForm").reset();

});

</script>

</body>
</html>
