
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hostel Food Saver</title>

  <style>
    body{
      font-family:Arial,sans-serif;
      background:#0f172a;
      color:white;
      margin:0;
      padding:20px;
    }

    .container{
      max-width:900px;
      margin:auto;
    }

    .card{
      background:#1e293b;
      padding:24px;
      border-radius:18px;
      margin-bottom:20px;
    }

    h1,h2,h3{
      margin-top:0;
    }

    input,select,button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:10px;
      font-size:16px;
    }

    input,select{
      background:#334155;
      color:white;
    }

    button{
      background:#2563eb;
      color:white;
      font-weight:bold;
      cursor:pointer;
    }

    .reset-btn{
      background:#dc2626;
    }

    .add-btn{
      background:#059669;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
      gap:15px;
      margin-top:20px;
    }

    .stat{
      background:#334155;
      padding:20px;
      border-radius:14px;
      text-align:center;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:15px;
    }

    th,td{
      border:1px solid #475569;
      padding:10px;
      text-align:left;
    }

    th{
      background:#334155;
    }

    .coord-item{
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:#334155;
      padding:10px;
      border-radius:10px;
      margin-top:10px;
    }

    .remove-btn{
      width:auto;
      background:#dc2626;
      padding:8px 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">
    <h1>🍽️ Hostel Food Saver</h1>
    <p>Reduce hostel food waste by confirming your meal attendance.</p>

    <form id="foodForm">

      <input type="text" id="name" placeholder="Student Name" required>

      <input type="text" id="room" placeholder="Room Number" required>

      <select id="meal" required>
        <option value="">Select Meal</option>
        <option>Breakfast</option>
        <option>Lunch</option>
        <option>Dinner</option>
      </select>

      <select id="status" required>
        <option value="">Will you eat today?</option>
        <option value="yes">Yes, I will eat</option>
        <option value="no">No, I will not eat</option>
      </select>

      <button type="submit">✅ Submit Response</button>

      <button type="button" class="reset-btn" onclick="resetDay()">
        🔄 Reset for Next Day
      </button>

    </form>

    <div class="stats">

      <div class="stat">
        <h2 id="eatCount">0</h2>
        <p>Eating</p>
      </div>

      <div class="stat">
        <h2 id="skipCount">0</h2>
        <p>Skipping</p>
      </div>

      <div class="stat">
        <h2 id="wasteSaved">0 kg</h2>
        <p>Waste Saved</p>
      </div>

    </div>

  </div>

  <div class="card">

    <h3>👥 Food Waste Coordinators</h3>

    <div id="coordinatorList"></div>

    <button type="button" class="add-btn" onclick="addCoordinator()">
      ➕ Add Coordinator
    </button>

  </div>

  <div class="card">

    <h2>📋 Student Responses</h2>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Room</th>
          <th>Meal</th>
          <th>Status</th>
        </tr>
      </thead>

      <tbody id="responseTable"></tbody>
    </table>

  </div>

</div>

<script>

const ADMIN_PASSWORD = "Hridanshu2026";

let eating = 0;
let skipping = 0;

let coordinators = ["Hridanshu"];

function updateStats(){

  document.getElementById("eatCount").innerText = eating;
  document.getElementById("skipCount").innerText = skipping;
  document.getElementById("wasteSaved").innerText =
    (skipping * 0.7).toFixed(1) + " kg";
}

document.getElementById("foodForm").addEventListener("submit", function(e){

  e.preventDefault();

  const name = document.getElementById("name").value;
  const room = document.getElementById("room").value;
  const meal = document.getElementById("meal").value;
  const status = document.getElementById("status").value;

  if(status === "yes") eating++;
  if(status === "no") skipping++;

  updateStats();

  document.getElementById("responseTable").innerHTML += `
    <tr>
      <td>${name}</td>
      <td>${room}</td>
      <td>${meal}</td>
      <td>${status}</td>
    </tr>
  `;

  alert("Response submitted successfully!");

  this.reset();
});

function resetDay(){

  const pass = prompt("Enter admin password:");

  if(pass !== ADMIN_PASSWORD){
    alert("❌ Only admin can reset data.");
    return;
  }

  eating = 0;
  skipping = 0;

  updateStats();

  document.getElementById("responseTable").innerHTML = "";

  alert("✅ New day started successfully!");
}

function renderCoordinators(){

  const list = document.getElementById("coordinatorList");

  list.innerHTML = "";

  coordinators.forEach(name => {

    list.innerHTML += `
      <div class="coord-item">
        <span>${name}</span>
        <button class="remove-btn"
                onclick="removeCoordinator('${name}')">
          Remove
        </button>
      </div>
    `;
  });
}

function addCoordinator(){

  const pass = prompt("Enter admin password:");

  if(pass !== ADMIN_PASSWORD){
    alert("❌ Only admin can add coordinators.");
    return;
  }

  const name = prompt("Enter coordinator name:");

  if(name){
    coordinators.push(name);
    renderCoordinators();
  }
}

function removeCoordinator(name){

  const pass = prompt("Enter admin password:");

  if(pass !== ADMIN_PASSWORD){
    alert("❌ Only admin can remove coordinators.");
    return;
  }

  coordinators = coordinators.filter(c => c !== name);

  renderCoordinators();
}

renderCoordinators();
updateStats();

</script>

</body>
</html>
